      <stop offset="1" stop-color="#49B6F2"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3D42C9" flood-opacity="0.22"/>
