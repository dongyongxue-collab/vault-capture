<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vault Capture logo</title>
  <desc id="desc">A rounded purple and blue mark with two diagonal white capture strokes.</desc>
  <defs>
    <linearGradient id="mark" x1="48" y1="34" x2="216" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CFF"/>
